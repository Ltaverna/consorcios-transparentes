# Consorcio Transparente — API en la máquina que hace el tunnel cloudflared.
# Uso: cp api/.env.example api/.env (completar) && docker compose up -d --build

# DNS upstream estable para el embedded resolver de Docker (127.0.0.11): sin esto, el
# upstream se hereda del /etc/resolv.conf del host al crear el contenedor y queda fijo; en
# una máquina que cambia de red, ese upstream se invalida y las consultas externas empiezan
# a fallar ("Temporary failure in name resolution") mientras los nombres internos siguen OK.
# Fijar 1.1.1.1/8.8.8.8 no reemplaza al embedded (api/mcp/etc. siguen resolviendo): solo
# cambia a dónde reenvía lo externo. Ver DEPLOY.md §7.
x-dns-estable: &dns-estable
  dns:
    - 1.1.1.1
    - 8.8.8.8

services:
  api:
    <<: *dns-estable
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: api/.env
    ports:
      - "127.0.0.1:8080:8080"   # solo loopback: expone cloudflared, no la LAN
    restart: unless-stopped
    # Modo local (sin Neon/R2): descomentar los volúmenes y en api/.env poner
    #   CT_DATABASE_URL=sqlite:////srv/datos/ct.db
    #   CT_STORAGE_DIR=/srv/storage
    # volumes:
    #   - ./datos-api/db:/srv/datos
    #   - ./datos-api/storage:/srv/storage

  worker:
    <<: *dns-estable
    build:
      context: .
      dockerfile: api/Dockerfile
    command: python worker.py
    env_file:
      - .env          # credenciales del portal y del bot (USER_REDCONAR, CT_API_BOT_*)
      - api/.env      # CT_DATABASE_URL y demás settings de la API (para el backup diario)
    environment:
      CT_PRIVADO: /srv/privado
    volumes:
      - ${CT_PRIVADO_HOST:?definir CT_PRIVADO_HOST en .env (ruta absoluta de la carpeta privada)}:/srv/privado
      - ./datos-api/backups:/srv/backups
    restart: unless-stopped

  mcp:
    <<: *dns-estable
    build:
      context: .
      dockerfile: api/Dockerfile
    command: python servidor_mcp.py
    environment:
      CT_API_BOT_EMAIL: ${CT_API_BOT_EMAIL:?}
      CT_API_BOT_CLAVE: ${CT_API_BOT_CLAVE:?}
      CT_MCP_TOKEN: ${CT_MCP_TOKEN:?definir CT_MCP_TOKEN en .env}
      CT_API_URL: ${CT_API_URL:-https://api-consorcio.neuralcore.dev}
    restart: unless-stopped

  tunnel:
    <<: *dns-estable
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - api
    restart: unless-stopped
